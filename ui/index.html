<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>StreamEmber Overlay Test</title>
<style>
  /* Phase 2/3 test page. The page background must stay transparent: only the panel is drawn over the game. */
  :root {
    --glass: rgba(14, 17, 24, 0.82);
    --line: rgba(255, 255, 255, 0.12);
    --text: #e9edf3;
    --muted: #9aa4b2;
    --accent: #ff7020;
    --ok: #3ddc84;
    --bad: #ff5370;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 14px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--text); }
  .panel {
    position: absolute; top: 48px; right: 48px; width: 380px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45); overflow: hidden;
  }
  .head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .head h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: 0.02em; flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
  .body { padding: 12px 16px; display: grid; gap: 10px; }
  .row { display: flex; justify-content: space-between; color: var(--muted); }
  .row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width 0.3s; }
  .actions { display: flex; gap: 8px; }
  button {
    flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
    background: rgba(255, 255, 255, 0.06); color: var(--text); font: inherit;
  }
  button:hover { background: rgba(255, 112, 32, 0.25); border-color: var(--accent); }
  input {
    width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: rgba(0, 0, 0, 0.3); color: var(--text); font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .log { max-height: 140px; overflow-y: auto; font: 12px/1.5 Consolas, monospace; color: var(--muted); }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint { font-size: 12px; color: var(--muted); }
  .bridge-off { color: var(--bad); }
</style>
</head>
<body>
  <section class="panel">
    <div class="head"><span class="dot"></span><h1>StreamEmber Overlay</h1><span id="clock">--:--:--</span></div>
    <div class="body">
      <div class="row"><span>Kare hızı (sayfa)</span><b id="fps">0</b></div>
      <div class="row"><span>Köprü</span><b id="bridge">bekleniyor</b></div>
      <div class="row"><span>Can</span><b id="health">-</b></div>
      <div class="bar"><i id="healthBar"></i></div>
      <div class="row"><span>Hız</span><b id="speed">-</b></div>
      <div class="row"><span>Konum</span><b id="pos">-</b></div>
      <div class="row"><span>Aranma</span><b id="wanted">-</b></div>
      <input id="text" placeholder="Klavye testi: buraya yaz (F8 ile menü modu)">
      <div class="actions">
        <button id="send">Oyuna gönder</button>
        <button id="close">Oyuna dön</button>
      </div>
      <div class="log" id="log"></div>
      <div class="hint">F7: göster/gizle · F8: menü modu (fare ve klavye arayüze)</div>
    </div>
  </section>

<script>
  (function () {
    var bridge = window.streamember;
    var $ = function (id) { return document.getElementById(id); };

    function log(text) {
      var line = document.createElement('div');
      line.textContent = new Date().toLocaleTimeString('tr-TR') + '  ' + text;
      var box = $('log');
      box.insertBefore(line, box.firstChild);
      while (box.childNodes.length > 30) { box.removeChild(box.lastChild); }
    }

    // Clock + page FPS (proves frames keep flowing to the game)
    var frames = 0, last = performance.now();
    function frame(now) {
      frames++;
      if (now - last >= 1000) {
        $('fps').textContent = Math.round(frames * 1000 / (now - last));
        frames = 0; last = now;
        $('clock').textContent = new Date().toLocaleTimeString('tr-TR');
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    if (!bridge) {
      $('bridge').textContent = 'yok (tarayıcıda açıldı)';
      $('bridge').className = 'bridge-off';
      return;
    }
    $('bridge').textContent = 'hazır';

    var statusCount = 0;
    bridge.on(function (msg) {
      if (msg && msg.type === 'status') {
        statusCount++;
        var pct = msg.maxHealth > 0 ? Math.max(0, Math.min(100, (msg.health / msg.maxHealth) * 100)) : 0;
        $('health').textContent = msg.health + ' / ' + msg.maxHealth;
        $('healthBar').style.width = pct + '%';
        $('speed').textContent = msg.speed.toFixed(1) + ' km/sa';
        $('pos').textContent = msg.x.toFixed(0) + ', ' + msg.y.toFixed(0) + ', ' + msg.z.toFixed(0);
        $('wanted').textContent = msg.wanted ? '★'.repeat(msg.wanted) : 'yok';
        $('bridge').textContent = 'hazır · ' + statusCount + ' mesaj';
        return;
      }
      log('oyundan: ' + JSON.stringify(msg));
    });

    $('send').addEventListener('click', function () {
      var text = $('text').value || 'merhaba';
      bridge.post({ type: 'hello', text: text, at: Date.now() });
      log('gönderildi: ' + text);
    });
    $('close').addEventListener('click', function () {
      bridge.post({ type: 'close' });
      log('menü modu kapatma isteği');
    });
    $('text').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { $('send').click(); }
    });
    log('sayfa yüklendi');
  })();
</script>
</body>
</html>
