; StreamEmber Overlay ayarları — oyunda StreamEmber\Overlay\overlay.ini
; Değişiklikler oyunu yeniden başlatınca geçerli olur.

[Overlay]
; 0 = overlay tamamen kapalı
Enabled=1
; 1 = CEF yüklenmez, yalnız üretilmiş bir test deseni çizilir (aşama 1: D3D11 çizim testi)
TestPattern=0
; Açılacak sayfa. Şemasız yol ui\ klasörüne göredir; boş = ui\index.html (basit test sayfası).
; mhud/trainer.html = MHud trainer (scripts\StreamEmber.TrainerDemo.dll ile). Tam URL de olur: http://127.0.0.1:5173/
StartUrl=mhud/trainer.html
; Sayfanın en fazla kare hızı (1-60)
FrameRate=60
; Menü modunda kendi imlecimizi çiz
DrawCursor=1
; Menü modunda oyunun ham fare/klavye girdisini (WM_INPUT) engelle
BlockRawInputInUiMode=1

[Hotkeys]
; Windows sanal tuş kodları, ONDALIK yazılır. 0 = kapalı. F7=118, F8=119, F9=120
; Overlay'i göster/gizle
ToggleVisible=118
; Menü modu: fare ve klavye arayüze gider
ToggleInput=119
