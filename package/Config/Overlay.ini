; StreamEmber Overlay - <game>\StreamEmber\Config\Overlay.ini (kept on updates)
; Lines starting with ';' are ignored. Changes apply after restarting the game.

[Overlay]
; 0 = overlay completely off
Enabled=1
; 1 = do not load CEF, draw a generated test pattern only (renderer test)
TestPattern=0
; Page shown until a script loads its own. Normally empty (nothing drawn): the overlay ships no page; scripts
; (e.g. StreamEmber Trainer) load theirs, usually from a CDN. A full URL (https://...) or a file path relative to
; the StreamEmber folder, e.g. for UI development: StartUrl=http://127.0.0.1:5173/
StartUrl=
; Maximum frame rate of the page (1-60)
FrameRate=60
; Draw our own cursor in UI input mode
DrawCursor=1
; Block the game's raw mouse/keyboard input (WM_INPUT) in UI input mode
BlockRawInputInUiMode=1

[Hotkeys]
; Windows virtual-key codes in DECIMAL. 0 = off. F7=118, F8=119, F9=120
; Show / hide the overlay
ToggleVisible=118
; UI input mode: mouse and keyboard go to the page
ToggleInput=119
